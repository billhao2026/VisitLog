name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 新提交取消旧的排队 run —— 公开仓库的 macOS runner 排队很慢，
# 不取消的话旧 run 会一直占着队列位。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 主检查：语法 / 冒烟测试 / 敏感扫描 ──────────────────────
  # 三平台各跑一遍。这是提交前必须过的关卡。
  check:
    name: 语法与冒烟测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 语法检查
        shell: bash
        run: |
          for f in server/*.js public/*.js scripts/*.js scripts/weekly_report/*.js test/*.js; do
            node --check "$f" || exit 1
          done

      - name: Python 语法检查
        shell: bash
        run: |
          # Windows runner 上命令名是 python，不是 python3
          PY=$(command -v python3 || command -v python)
          for f in scripts/*.py; do
            "$PY" -m py_compile "$f" || exit 1
          done

      - name: 冒烟测试
        shell: bash
        run: npm test

      - name: 启动冒烟测试
        shell: bash
        run: |
          node server/server.js > server.log 2>&1 &
          SERVER_PID=$!
          sleep 6
          # 首页可达 + 核心 API 返回 ok
          curl -s --noproxy '*' -o /dev/null -w "首页 HTTP %{http_code}\n" http://localhost:8897/
          curl -s --noproxy '*' http://localhost:8897/api/stats | head -c 200
          echo
          kill $SERVER_PID 2>/dev/null || true

      - name: 检查敏感信息泄漏
        shell: bash
        run: |
          # 防止误提交真实数据 / 本机路径 / 常见密钥
          FAIL=0
          if git ls-files | grep -E '\.(db|sqlite3|wav|mp3|m4a)$'; then
            echo "::error::检测到数据/音频文件被提交"
            FAIL=1
          fi
          # 硬编码本机路径检测。
          # 注意：CONTRIBUTING.md / PULL_REQUEST_TEMPLATE.md / SECURITY.md 里出现的
          # /Users/xxx、C:\Users\xxx 是「不要这样写」的举例说明，不是真实路径，
          # 所以要排除掉——否则扫描永远失败，规则也就没人看了。
          if grep -rInE '/Users/[A-Za-z][A-Za-z0-9._-]+/|C:\\Users\\[A-Za-z][A-Za-z0-9._-]+\\' \
               --include='*.js' --include='*.py' --include='*.md' \
               --include='*.json' --include='*.bat' --include='*.command' \
               --include='*.yml' --include='Dockerfile' . \
               | grep -v 'public/vendor/' \
               | grep -v 'CONTRIBUTING.md' \
               | grep -v 'PULL_REQUEST_TEMPLATE.md' \
               | grep -v 'SECURITY.md'; then
            echo "::error::检测到硬编码本机路径"
            FAIL=1
          fi
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --include='*.js' --include='*.py' --include='*.md' --include='*.json' \
               --include='*.yml' . \
               | grep -v 'public/vendor/'; then
            echo "::error::检测到疑似密钥"
            FAIL=1
          fi
          # 运行时数据目录（数据库、录音、模型）不应进仓库
          if git ls-files | grep -E '^data/|^audio/|^models/'; then
            echo "::error::检测到运行时数据目录被提交"
            FAIL=1
          fi
          exit $FAIL

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.os }}
          path: server.log

  # ── 页面渲染自检：仅 macOS ────────────────────────────────────
  # 需要系统 WebKit，只能在 macOS 上跑。单独拆成一个 job：
  # macOS runner 排队常常要十几分钟，挂在主检查里会拖慢（甚至拖挂）整条流水线。
  render:
    name: 页面渲染自检 (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true   # 排队被取消不影响主检查的结论

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 页面渲染自检
        shell: bash
        run: |
          # 灌入演示数据，否则页面是空的，自检无从判断渲染是否正常
          node scripts/demo_data.js -- --reset
          node server/server.js > server.log 2>&1 &
          SERVER_PID=$!
          sleep 6
          node scripts/check-render.js http://localhost:8897
          kill $SERVER_PID 2>/dev/null || true

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-log-macos
          path: server.log
